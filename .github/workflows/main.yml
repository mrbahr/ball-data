name: Update Football Matches

on:
  schedule:
    - cron: '*/5 * * * *' # تم تعديلها لـ 5 دقائق لتكون أكثر استقراراً مع سيرفرات جيتهاب
  workflow_dispatch: 

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # مهم جداً لجلب تاريخ الـ Git بالكامل ومنع أخطاء الـ Push

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests pytz

      - name: Run Scraper Script
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python fetch_matches.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          
          git fetch origin main
          git reset --soft FETCH_HEAD
          
          git add today_matches.json
          git diff --quiet && git diff --staged --quiet || git commit -m "تحديث مباريات اليوم أوتوماتيكياً"
          
          
          git push origin main
